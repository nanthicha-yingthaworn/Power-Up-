<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Up! Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <header class="hero">
        <div class="container">
            <h1> Power Up!</h1>
            <p>Personal Learning Portfolio — เก็บสิ่งที่ได้เรียนรู้ของเรา</p>
        </div>
    </header>

    <main class="container my-4">

        <div class="box">
            <h2>1. เลือก Portfolio</h2>

            <div class="d-flex flex-wrap gap-2 align-items-center">
                <select id="portfolioSelect" class="form-select select-portfolio"></select>

                <div class="ms-auto d-flex gap-2">
                    <button id="btnNew" class="btn btn-success">+ Add</button>
                    <button id="btnDelete" class="btn btn-danger">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>


            </div>
        </div>

        <div class="row g-4">

            <div class="col-lg-5">

                <form id="portfolioForm" class="box" novalidate>
                    <h2 id="portfolioFormTitle">2. สร้าง Portfolio</h2>
                    <div id="portfolioErrors" class="alert alert-danger d-none"></div>

                    <label class="form-label" for="displayName">ชื่อที่ต้องการแสดง *</label>
                    <input class="form-control mb-3" id="displayName" placeholder="ชื่อจริงหรือชื่อเล่น">


                    <label class="form-label" for="whatIEnjoy">What I Enjoy (ชอบทำอะไร) *</label>
                    <textarea class="form-control mb-3" id="whatIEnjoy" rows="2"></textarea>

                    <label class="form-label" for="whatIveTried">What I've Tried (ลองทำอะไรมาแล้ว) *</label>
                    <textarea class="form-control mb-3" id="whatIveTried" rows="2"></textarea>

                    <label class="form-label" for="whatImCuriousAbout">What I'm Curious About (อยากรู้อะไรเพิ่ม)
                        *</label>
                    <textarea class="form-control mb-3" id="whatImCuriousAbout" rows="2"></textarea>

                    <button type="submit" class="btn btn-primary w-100">บันทึก Portfolio</button>
                </form>

                <form id="itemForm" class="box" novalidate>
                    <h2>3. เพิ่ม Portfolio Item</h2>
                    <div id="itemErrors" class="alert alert-danger d-none"></div>

                    <label class="form-label" for="title">Title *</label>
                    <input class="form-control mb-3" id="title" placeholder="เช่น My First Website">

                    <div class="row">
                        <div class="col-6">
                            <label class="form-label" for="type">Type *</label>
                            <select class="form-select mb-3" id="type">
                                <option value="">-- เลือก --</option>
                                <option>Course Assignment</option>
                                <option>Project</option>
                                <option>Activity</option>
                                <option>Competition</option>
                                <option>Self-learning</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="date">Date *</label>
                            <input class="form-control mb-3" id="date" type="date">
                        </div>
                    </div>

                    <label class="form-label" for="role">Role *</label>
                    <input class="form-control mb-3" id="role" placeholder="เช่น Developer">

                    <label class="form-label" for="description">Description *</label>
                    <textarea class="form-control mb-3" id="description" rows="2"></textarea>

                    <label class="form-label" for="skills">Skills * <small class="text-muted">(คั่นด้วย
                            ,)</small></label>
                    <input class="form-control mb-3" id="skills" placeholder="HTML, CSS">

                    <p class="sub-title">Reflection</p>
                    <label class="form-label" for="whatIDid">What I did *</label>
                    <textarea class="form-control mb-2" id="whatIDid" rows="2"></textarea>
                    <label class="form-label" for="whatILearned">What I learned *</label>
                    <textarea class="form-control mb-2" id="whatILearned" rows="2"></textarea>
                    <label class="form-label" for="challenge">Challenge *</label>
                    <textarea class="form-control mb-2" id="challenge" rows="2"></textarea>
                    <label class="form-label" for="nextStep">Next step *</label>
                    <textarea class="form-control mb-3" id="nextStep" rows="2"></textarea>

                    <label class="form-label" for="evidence">Evidence * <small class="text-muted">(1 บรรทัด = 1
                            ลิงก์)</small></label>
                    <textarea class="form-control mb-3" id="evidence" rows="2"
                        placeholder="https://github.com/..."></textarea>

                    <button type="submit" class="btn btn-primary w-100">บันทึก Item</button>
                </form>
            </div>

            <div class="col-lg-7">
                <div id="portfolioView"></div>
            </div>
    </main>

    <footer class="text-center text-muted py-4">© 2026 CS100 Power Up! · Checkpoint <br>

        Personal Learning Portfolio | Learning, Creating & Growing.</footer>

    <script src="js/script.js"></script>
</body>

</html>
